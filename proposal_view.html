<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal</title>
<style>
  html,body{margin:0;height:100%;background:#000;}
  #scld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#EDE9E3;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;color:rgba(0,0,0,0.45);text-align:center;padding:24px;line-height:1.7;z-index:10;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div id="scld">Loading proposal&hellip;</div>
<script>
(function(){
  var SB_URL="https://fdfrziuuqagvmbjhvjde.supabase.co";
  var SB_KEY="sb_publishable_bVhMFzlTqo2IHwmsc9IA8g_sdt7I_Ch";
  function msg(t){ var l=document.getElementById('scld'); if(l) l.textContent=t; }
  if(typeof window.supabase==='undefined'||!window.supabase.createClient){ msg('Could not load (scripts may be blocked). Try another browser or reload.'); return; }
  var sb; try{ sb=window.supabase.createClient(SB_URL,SB_KEY); }catch(e){ msg('Viewer error: '+((e&&e.message)||e)); return; }
  var id=new URLSearchParams(location.search).get('id');
  if(!id){ msg('No proposal specified.'); return; }
  function render(html){ if(!html){ msg('This proposal is empty.'); return; } document.open(); document.write(html); document.close(); }
  sb.from('public_proposals').select('html').eq('id',id).single().then(function(r){
    if(r.error||!r.data){ msg('This proposal link is no longer available.'); return; }
    render(r.data.html||'');
  },function(e){ msg('Could not load this proposal: '+((e&&e.message)||e)); });
})();
</script>
</body>
</html>
